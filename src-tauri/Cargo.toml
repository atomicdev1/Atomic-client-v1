[package]
name = "atomic-client"
version = "0.1.0"
description = "Atomic Client - a fast Minecraft Java launcher"
edition = "2021"

[lib]
name = "atomic_client_lib"
path = "src/lib.rs"

[[bin]]
name = "atomic-client"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
futures-util = "0.3"
anyhow = "1"
sha1 = "0.10"
md5 = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
tauri = { version = "2", optional = true }

[features]
default = []
tauri = ["dep:tauri", "dep:tauri-build"]
